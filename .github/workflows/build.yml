name: build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0
      - name: Build
        run: gradle build --no-daemon --stacktrace
      - name: Check the jar has classes and a mod manifest
        run: |
          ls -l build/libs
          unzip -l build/libs/vinyl-music-player-1.0.21+26.3.jar | grep -E "fabric.mod.json|VinylClient.class|SoundEngineMixin.class|META-INF/jars"
      # A GitHub Release gives a direct .jar download (artifacts are always wrapped in a .zip).
      - name: Publish the jar as a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Vinyl Music Player 1.0.21 for 26.3 (build ${{ github.run_number }})
          files: build/libs/vinyl-music-player-1.0.21+26.3.jar
          make_latest: true
      - name: Also keep a zipped artifact
        uses: actions/upload-artifact@v4
        with:
          name: vinyl-music-player-1.0.21+26.3
          path: build/libs/vinyl-music-player-1.0.21+26.3.jar
          if-no-files-found: error
