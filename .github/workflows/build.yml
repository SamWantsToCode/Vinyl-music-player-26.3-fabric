name: Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0
      - name: Build
        run: gradle build --no-daemon --stacktrace
      - name: Check the jar
        run: |
          ls -l build/libs
          jar=$(ls build/libs/needledrop-*.jar | head -n 1)
          unzip -l "$jar" | grep -E "fabric.mod.json|icon.png|VinylClient.class|SoundEngineMixin.class|META-INF/jars"
      - name: Publish the jar as a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Needledrop build ${{ github.run_number }}
          files: build/libs/needledrop-*.jar
          make_latest: true
